apiVersion: apps/v1
kind: Deployment

metadata:
  name: movies
  namespace: microservices

spec:
  replicas: 2

  selector:
    matchLabels:
      app: movies

  template:
    metadata:
      labels:
        app: movies

    spec:
      containers:
        - name: movies
          image: kube-microservices:latest
          imagePullPolicy: IfNotPresent

          command:
            - /app/movies

          ports:
            - containerPort: 8080