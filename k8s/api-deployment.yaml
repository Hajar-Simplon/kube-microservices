apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: microservices

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api
                topologyKey: kubernetes.io/hostname

      containers:
        - name: api
          image: kube-microservices:latest
          imagePullPolicy: IfNotPresent

          command:
            - /app/api

          envFrom:
            - configMapKeyRef:
                name: api-config
                key: BOOKS_API_HOST
            - configMapKeyRef:
                name: api-config
                key: MOVIES_API_HOST

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          ports:
            - containerPort: 8080