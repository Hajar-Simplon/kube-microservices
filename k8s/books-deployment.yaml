apiVersion: apps/v1
kind: Deployment

metadata:
  name: books
  namespace: microservices

spec:
  replicas: 2

  selector:
    matchLabels:
      app: books

  template:
    metadata:
      labels:
        app: books

    spec:
      affinity:
        podAntiAffinity:
  
          preferredDuringSchedulingIgnoredDuringExecution:
  
            - weight: 100
  
              podAffinityTerm:
  
                labelSelector:
  
                  matchExpressions:
  
                    - key: app
  
                      operator: In
  
                      values:
                        - books
  
                topologyKey: kubernetes.io/hostname
      containers:
        - name: books
          image: kube-microservices:latest
          imagePullPolicy: IfNotPresent

          command:
            - /app/books

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"